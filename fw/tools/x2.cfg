# OpenOCD target setup for the Geek Bar Pulse X2 (PY32F030x8).
#
# OpenOCD 0.12 has no PY32 support, so the DAP and target are declared by
# hand. target/swj-dp.tcl only *defines* swj_newdap — it never calls it, so
# a bare "dap init" silently creates nothing. All three lines below are
# required.
#
# Wiring (confirmed on hardware — note this is the reverse of what the
# original notes guessed):
#     probe SWDIO -> USB-C B5 / CC2
#     probe SWCLK -> USB-C A5 / CC1
#     probe GND   -> the one populated GND pin on the breakout
#
# 100 kHz deliberately: the link is hand-held dupont wire at battery voltage,
# and speed buys nothing here.

source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 100

source [find target/swj-dp.tcl]
swj_newdap x2 cpu -expected-id 0x0
dap create x2.dap -chain-position x2.cpu
target create x2.target cortex_m -dap x2.dap
